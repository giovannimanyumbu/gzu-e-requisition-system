version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: gzu_db
    environment:
      POSTGRES_USER: gzu_user
      POSTGRES_PASSWORD: gzu_password_secure
      POSTGRES_DB: gzu_requisition
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gzu_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gzu_network

  # Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gzu_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://gzu_user:gzu_password_secure@db:5432/gzu_requisition
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
      JWT_EXPIRE: 24h
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev
    networks:
      - gzu_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gzu_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm start
    networks:
      - gzu_network

volumes:
  postgres_data:
    driver: local

networks:
  gzu_network:
    driver: bridge
